name: Generate Contributions Calendar

on:
schedule:
- cron: "15 0 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Generate contribution calendar
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USER: MohammedMaaz06
    run: |
      python scripts/generate_contributions.py

  - name: Publish generated calendar
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git checkout --orphan output
      git rm -rf . || true

      cp assets/contributions.svg contributions.svg

      git add contributions.svg
      git commit -m "Update contribution calendar"
      git push --force origin output
```
