<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="Build, learn, ship, repeat">
<defs><linearGradient id="f" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#60a5fa"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="500 0" dur="5s" repeatCount="indefinite"/></linearGradient></defs>
<rect x="100" y="20" width="800" height="2" fill="url(#f)"/>
<text x="500" y="62" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" letter-spacing="8" fill="url(#f)">BUILD  ·  LEARN  ·  SHIP  ·  REPEAT</text></svg>